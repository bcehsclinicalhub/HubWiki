name: Update Schedule

on:
  schedule:
    - cron: '24 * * * *'   # Every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Download latest schedule
        id: download
        env:
          SECRET_URL: ${{ secrets.BYTEBLOC_URL }}
        run: |
          set -e

          echo "schedule_ready=false" >> "$GITHUB_OUTPUT"

          for attempt in 1 2; do
            echo "Downloading latest schedule (Attempt $attempt)..."

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 120 \
              --write-out "%{http_code}" \
              --output schedule.tmp \
              "$SECRET_URL")

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Download failed with HTTP Status: $HTTP_CODE"
              rm -f schedule.tmp
              exit 1
            fi

            if [ ! -s schedule.tmp ]; then
              echo "Downloaded file is empty."
              rm -f schedule.tmp
              exit 1
            fi

            if grep -qi "ByteBloc rate limit reached" schedule.tmp || \
               grep -qi "called at most once every 10 min" schedule.tmp; then

              if [ "$attempt" -eq 1 ]; then
                echo "ByteBloc rate limit reached."
                echo "Waiting 10.5 minutes (630 seconds)..."
                rm -f schedule.tmp
                sleep 630
                continue
              else
                echo "ByteBloc rate limit still active."
                echo "Existing schedules will be retained."
                echo "⚠ ByteBloc rate limit encountered. Existing schedules retained." >> "$GITHUB_STEP_SUMMARY"
                rm -f schedule.tmp
                exit 0
              fi
            fi

            break
          done

          if ! grep -q "^<" schedule.tmp; then
            echo "Response is not XML."
            cat schedule.tmp
            rm -f schedule.tmp
            exit 1
          fi

          sudo apt-get update >/dev/null
          sudo apt-get install -y libxml2-utils >/dev/null

          if ! xmllint --noout schedule.tmp; then
            echo "XML is malformed."
            rm -f schedule.tmp
            exit 1
          fi

          ROOT=$(xmllint --xpath 'name(/*)' schedule.tmp)

          if [ "$ROOT" != "Schedule" ]; then
            echo "Unexpected XML root element: $ROOT"
            rm -f schedule.tmp
            exit 1
          fi

          cp schedule.tmp /tmp/new-schedule.xml
          rm schedule.tmp

          echo "schedule_ready=true" >> "$GITHUB_OUTPUT"
          echo "Schedule downloaded and validated successfully."

      - name: Update schedule on DEV and PRD
        if: steps.download.outputs.schedule_ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          update_branch() {
            BRANCH="$1"

            echo ""
            echo "========================================"
            echo "Updating schedule on $BRANCH"
            echo "========================================"

            for attempt in 1 2 3; do
              echo "Attempt $attempt..."

              git fetch origin "$BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git reset --hard "origin/$BRANCH"

              mkdir -p docs/assets
              cp /tmp/new-schedule.xml docs/assets/data.xml

              git add docs/assets/data.xml

              if git diff --cached --quiet; then
                echo "Schedule already up to date on $BRANCH."
                return 0
              fi

              git commit -m "Update schedule"

              if git push origin HEAD:"$BRANCH"; then
                echo "Successfully updated $BRANCH."
                return 0
              fi

              echo "Push rejected because $BRANCH changed. Retrying..."
              sleep 2
            done

            echo "ERROR: Could not update $BRANCH after 3 attempts."
            return 1
          }

          update_branch develop
          update_branch main