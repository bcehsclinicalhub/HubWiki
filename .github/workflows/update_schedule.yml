name: Update Schedule

on:
  schedule:
    - cron: '52 * * * *' # Every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Download latest schedule
        env:
          SECRET_URL: ${{ secrets.BYTEBLOC_URL }}
        run: |
          set -e

          # We will attempt to download twice. If we get rate limited on
          # attempt 1, wait out the 10-minute cooldown and try once more.
          for attempt in 1 2; do
            echo "Downloading latest schedule (Attempt $attempt)..."

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 120 \
              --write-out "%{http_code}" \
              --output schedule.tmp \
              "$SECRET_URL")

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Download failed with HTTP Status: $HTTP_CODE"
              rm -f schedule.tmp
              exit 1
            fi

            if [ ! -s schedule.tmp ]; then
              echo "Downloaded file is empty."
              rm -f schedule.tmp
              exit 1
            fi

            # Check for the actual error strings returned by ByteBloc.
            if grep -qi "ByteBloc rate limit reached" schedule.tmp || \
               grep -qi "called at most once every 10 min" schedule.tmp; then

              if [ "$attempt" -eq 1 ]; then
                echo "ByteBloc rate limit reached."
                echo "Waiting 10.5 minutes (630s) to clear the cooldown..."
                rm -f schedule.tmp
                sleep 630
                continue
              else
                echo "ByteBloc rate limit still active."
                echo "Keeping existing schedule."
                echo "Will try again during the next scheduled run."
                echo "⚠ ByteBloc rate limit encountered. Existing schedule retained." >> "$GITHUB_STEP_SUMMARY"
                rm -f schedule.tmp
                exit 0
              fi
            fi

            # Download succeeded.
            break
          done

          if ! grep -q "^<" schedule.tmp; then
            echo "Response is not XML."
            cat schedule.tmp
            rm -f schedule.tmp
            exit 1
          fi

          sudo apt-get update >/dev/null
          sudo apt-get install -y libxml2-utils >/dev/null

          if ! xmllint --noout schedule.tmp; then
            echo "XML is malformed."
            rm -f schedule.tmp
            exit 1
          fi

          ROOT=$(xmllint --xpath 'name(/*)' schedule.tmp)

          if [ "$ROOT" != "Schedule" ]; then
            echo "Unexpected XML root element: $ROOT"
            rm -f schedule.tmp
            exit 1
          fi

          # Keep the validated download outside the repository.
          # We will apply it independently to develop and main.
          cp schedule.tmp /tmp/new-schedule.xml
          rm schedule.tmp

          echo "Schedule downloaded and validated successfully."

      - name: Update schedule on DEV and PRD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          update_branch() {
            BRANCH="$1"

            echo ""
            echo "========================================"
            echo "Updating schedule on $BRANCH"
            echo "========================================"

            for attempt in 1 2 3; do
              echo "Attempt $attempt..."

              # Get the latest version of this branch.
              git fetch origin "$BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git reset --hard "origin/$BRANCH"

              # Apply the freshly downloaded schedule.
              mkdir -p docs/assets
              cp /tmp/new-schedule.xml docs/assets/data.xml

              git add docs/assets/data.xml

              if git diff --cached --quiet; then
                echo "Schedule already up to date on $BRANCH."
                return 0
              fi

              git commit -m "Update schedule"

              if git push origin HEAD:"$BRANCH"; then
                echo "Successfully updated $BRANCH."
                return 0
              fi

              echo "Push rejected because $BRANCH changed. Retrying..."
              sleep 2
            done

            echo "ERROR: Could not update $BRANCH after 3 attempts."
            return 1
          }

          # Update DEV first.
          update_branch develop

          # Then update PRD.
          update_branch main