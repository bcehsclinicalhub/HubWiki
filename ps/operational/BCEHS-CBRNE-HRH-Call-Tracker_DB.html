<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCEHS Paramedic Specialist – CBRNE / Haz-Mat & High Risk Hazard Call Tracker</title>
<style>
  :root{
    --navy:#0b2545; --blue:#13315c; --accent:#c8102e; --bg:#eef2f6; --card:#fff;
    --line:#d5dde6; --text:#1b2330; --muted:#5b6778; --ok:#1d7a46;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--accent)}
  header h1{margin:0;font-size:20px;letter-spacing:.3px}
  header .sub{font-size:13px;opacity:.8}
  nav{display:flex;gap:4px;background:var(--blue);padding:0 24px}
  nav button{background:none;border:none;color:#cfd9e6;padding:12px 18px;font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
  nav button.active{color:#fff;border-bottom-color:var(--accent);font-weight:600}
  main{max-width:1200px;margin:20px auto;padding:0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card h2{margin:0 0 14px;font-size:17px;color:var(--navy)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid #b9c4d1;border-radius:5px;font-size:15px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid #4a7fc1;border-color:#4a7fc1}
  textarea{min-height:70px;resize:vertical}
  .checks{display:flex;flex-wrap:wrap;gap:8px 18px;padding:6px 0}
  .checks label{display:flex;align-items:center;gap:7px;text-transform:none;font-size:15px;font-weight:500;color:var(--text);letter-spacing:0;margin:0;cursor:pointer}
  .checks input{width:18px;height:18px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:5px;padding:10px 18px;font-size:15px;cursor:pointer;font-weight:600}
  .btn:hover{background:var(--blue)}
  .btn.red{background:var(--accent)} .btn.grey{background:#6b7787} .btn.green{background:var(--ok)}
  .btn.sm{padding:5px 10px;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .span2{grid-column:span 2} .span-all{grid-column:1/-1}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#f3f6f9;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
  tr:hover td{background:#f8fafc}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--ok);color:#fff;padding:12px 18px;border-radius:6px;font-weight:600;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .note{font-size:13px;color:var(--muted)}
  .warn{background:#fff4e5;border:1px solid #f0c27b;color:#7a4b00;padding:9px 12px;border-radius:5px;font-size:13px;margin-bottom:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .stat h3{margin:0 0 8px;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--accent);padding-bottom:4px}
  .bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
  .bar .lbl{width:150px;flex-shrink:0}
  .bar .trk{flex:1;background:#e7ecf2;border-radius:3px;height:14px;overflow:hidden}
  .bar .fill{background:var(--blue);height:100%}
  .bar .n{width:60px;text-align:right;font-variant-numeric:tabular-nums}
  .big{font-size:38px;font-weight:700;color:var(--navy)}
  .hidden{display:none}
  .fu{border-left:3px solid var(--accent);background:#f8f9fb;padding:4px 8px;margin-top:5px;font-size:13px}
  .pill{display:inline-block;background:#e7ecf2;border-radius:10px;padding:1px 8px;margin:1px;font-size:12px}
  #reportArea .rpt-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--navy);padding-bottom:8px;margin-bottom:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <div>
    <h1>CBRNE / Haz-Mat &amp; High Risk Hazard Call Tracker</h1>
    <div class="sub">BCEHS Paramedic Specialist Desk</div>
  </div>
  <div class="sub" id="clock"></div>
</header>

<nav>
  <button class="active" data-tab="entry">New Call</button>
  <button data-tab="log">Call Log</button>
  <button data-tab="report">Monthly Report</button>
</nav>

<main>

<!-- ================= NEW CALL ================= -->
<section id="tab-entry" class="section">
  <div class="card">
    <h2 id="formTitle">Log a New Call</h2>
    <div class="warn">Do not enter patient names or personal health information. Use the incident number only.</div>
    <form id="callForm" autocomplete="off">
      <input type="hidden" id="editId">
      <div class="grid">
        <div><label for="fDate">Date of Incident</label><input type="date" id="fDate" required></div>
        <div><label for="fIncident">Incident Number</label><input type="text" id="fIncident" required placeholder="e.g. 26-123456"></div>
        <div><label for="fTime">Time of Call from Crew</label>
          <div class="row" style="flex-wrap:nowrap"><input type="time" id="fTime" required><button type="button" class="btn sm grey" id="nowBtn">Now</button></div></div>
        <div><label for="fSpecialist">Specialist Taking Call</label><select id="fSpecialist" required></select></div>

        <div><label for="fType">Nature of Call – Type</label>
          <select id="fType" required>
            <option value="">— Select —</option>
            <option>Transportation</option><option>Residential</option><option>Industry</option><option>Outdoor / Back Country</option><option>Other</option>
          </select></div>
        <div><label for="fHazard">CBRNE Hazard</label>
          <select id="fHazard" required>
            <option value="">— Select —</option>
            <option>Chemical</option><option>Biological</option><option>Radioactive</option><option>Nuclear</option><option>Explosive</option>
            <option value="N/A">N/A – HRH only</option>
          </select></div>
        <div class="span2"><label for="fHrh">High Risk Hazard (HRH Field Support Guide)</label>
          <select id="fHrh" required></select></div>
        <div><label for="fIntent">Intent</label>
          <select id="fIntent" required>
            <option value="">— Select —</option>
            <option>Accidental</option><option>Self-harm</option><option>Intentional</option>
          </select></div>
        <div><label for="fCanutec">CANUTEC Contacted</label>
          <select id="fCanutec" required>
            <option value="">— Select —</option><option>Yes</option><option>No</option>
          </select></div>
        <div><label for="fOncar">On Car Specialist Response</label>
          <select id="fOncar" required>
            <option value="">— Select —</option><option>Yes</option><option>No</option>
          </select></div>

        <div class="span-all"><label>Advice Given (select all that apply)</label>
          <div class="checks" id="adviceChecks"></div></div>

        <div class="span-all"><label for="fNotes">Product / UN Number (optional)</label>
          <input type="text" id="fNotes" placeholder="e.g. Chlorine, UN1017"></div>

        <div class="span-all"><label for="fComments">Comments</label>
          <textarea id="fComments" style="min-height:110px" placeholder="Details of the call, advice given, crew concerns, follow-up needed…"></textarea></div>
        <div class="span-all hidden" id="followWrap"><label>Follow-up Comments</label><div id="followList"></div></div>
      </div>
      <div class="row" style="margin-top:16px">
        <button type="submit" class="btn" id="saveBtn">Save Call</button>
        <button type="button" class="btn grey" id="clearBtn">Clear</button>
        <button type="button" class="btn grey hidden" id="cancelEditBtn">Cancel Edit</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Today's Calls</h2>
    <div id="todayList" class="note">No calls logged today.</div>
  </div>
</section>

<!-- ================= LOG ================= -->
<section id="tab-log" class="section hidden">
  <div class="card">
    <h2>Call Log</h2>
    <div class="row" style="margin-bottom:12px">
      <div><label for="logMonth">Month</label><input type="month" id="logMonth"></div>
      <div style="flex:1;min-width:200px"><label for="logSearch">Search</label><input type="text" id="logSearch" placeholder="Incident #, specialist, notes…"></div>
      <div style="align-self:flex-end"><button class="btn grey" id="logAllBtn">Show All</button></div>
      <div style="align-self:flex-end"><button class="btn green" id="csvBtn">Export CSV</button></div>
    </div>
    <div style="overflow:auto;max-height:65vh"><table id="logTable"></table></div>
  </div>
</section>

<!-- ================= REPORT ================= -->
<section id="tab-report" class="section hidden">
  <div class="card">
    <h2>Call Activity Summary</h2>
    <div class="row">
      <div>
        <label for="rptMode">Time Period</label>
        <select id="rptMode">
          <option value="month">Single Month</option>
          <option value="ytd">Year-to-Date (Current Year)</option>
          <option value="all">All-Time</option>
        </select>
      </div>
      <div id="rptMonthWrap"><label for="rptMonth">Select Month</label><input type="month" id="rptMonth"></div>
      <div style="align-self:flex-end"><button type="button" class="btn grey" id="syncReportBtn">↻ Sync Latest</button></div>
    </div>
  </div>
  <div class="card" id="reportArea"><p class="note">Loading summary…</p></div>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
(function(){
const SUPABASE_URL = "https://ztpgapnyyjptmhpvdsdq.supabase.co";
const SUPABASE_KEY = "sb_publishable_Yru_sbAt3MGNZ3Cz1Zf9ow_9E_qkPxz";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DEFAULT_SPECS = ["287PS1D","287PS1N","287PS2","287PS3"];
const ORG_TITLE = "BCEHS Paramedic Specialist – CBRNE / Haz-Mat & High Risk Hazard Calls";

const ADVICE = ["Decon","Scene Safety","Chemical Properties","On-Scene Treatment Recommendations","PPE","Staging / Safe Approach","Do Not Enter / No Rescue","Specialized Resources Requested"];
const TYPES = ["Transportation","Residential","Industry","Outdoor / Back Country","Other"];
const HAZARDS = ["Chemical","Biological","Radioactive","Nuclear","Explosive"];
const INTENTS = ["Accidental","Self-harm","Intentional"];
const HRH = ["Avalanche hazard areas", "Energized machinery / equipment", "Moving vehicles and equipment", "Around or over water", "Flooding", "Confined spaces", "Working at heights", "Blasting and explosions", "Pressure washing & abrasive blasting", "Excavations or trenches", "Wildfire, fire, flames and lightning", "Oil and gas industry", "Insects, animals and wildlife", "Aircraft", "Mines or underground workings", "Electricity", "Falling hazards", "Resource or access roads", "Back country response", "Violence & weapons in the workplace", "Tunnels", "Slopes and inclines", "Commercial cargo (tankers / transports / couriers)", "Chemical responses", "Biological responses", "Radiological responses", "Toxic gases", "Environmental exposure – cold", "Environmental exposure – heat", "Noise / vibration", "Unknown substance responses"];
const hrhLabel = i => `HRH ${i+1} – ${HRH[i]}`;
const HRH_LABELS = HRH.map((h,i)=>hrhLabel(i));

const $ = id => document.getElementById(id);
let calls = [];

const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowTime = () => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const thisMonth = () => todayStr().slice(0,7);
const thisYear = () => todayStr().slice(0,4);
const monthName = m => { const [y,mo]=m.split("-"); return new Date(+y, +mo-1, 1).toLocaleString("en-CA",{month:"long",year:"numeric"}); };
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2500); }

// --- DATABASE SYNC ---
async function loadCalls(showToast){
  const { data, error } = await db.from("calls").select("*").order("date", { ascending: false }).order("time", { ascending: false });
  if(error){ alert("Database load error: " + error.message); return; }
  calls = (data || []).map(c => ({ ...c, advice: c.advice || [], followups: c.followups || [] }));
  renderToday();
  if(!$("tab-log").classList.contains("hidden")) renderLog();
  if(!$("tab-report").classList.contains("hidden")) renderReport();
  if(showToast) toast("Synced latest calls");
}

// --- UI & FORM LOGIC ---
setInterval(()=>{ $("clock").textContent = new Date().toLocaleString("en-CA",{dateStyle:"full",timeStyle:"short"}); },1000);
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
async function showTab(t){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===t));
  document.querySelectorAll(".section").forEach(s=>s.classList.toggle("hidden", s.id!=="tab-"+t));
  if(t==="log" || t==="report") await loadCalls(false);
}

$("fHrh").innerHTML = `<option value="">— Select —</option><option value="N/A">N/A – CBRNE only</option>` + HRH_LABELS.map(l=>`<option>${esc(l)}</option>`).join("");
$("adviceChecks").innerHTML = ADVICE.map((a,i)=>`<label><input type="checkbox" value="${a}" id="adv${i}"> ${a}</label>`).join("");
function fillSpecialists(sel){
  const s=$("fSpecialist");
  s.innerHTML = `<option value="">— Select —</option>` + DEFAULT_SPECS.map(n=>`<option>${esc(n)}</option>`).join("");
  if(sel){ if(!DEFAULT_SPECS.includes(sel)) s.insertAdjacentHTML("beforeend",`<option>${esc(sel)}</option>`); s.value=sel; }
}
function resetForm(){
  const keepSpec = $("fSpecialist").value;
  $("callForm").reset(); $("editId").value="";
  $("fDate").value = todayStr(); $("fTime").value = nowTime();
  fillSpecialists(keepSpec);
  $("followWrap").classList.add("hidden"); $("followList").innerHTML="";
  $("formTitle").textContent="Log a New Call"; $("saveBtn").textContent="Save Call";
  $("cancelEditBtn").classList.add("hidden");
}
$("nowBtn").onclick = ()=> $("fTime").value = nowTime();
$("clearBtn").onclick = resetForm;
$("cancelEditBtn").onclick = resetForm;

$("callForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const advice = ADVICE.filter((a,i)=>$("adv"+i).checked);
  if($("fHazard").value==="N/A" && $("fHrh").value==="N/A"){ alert("Select a CBRNE hazard, a High Risk Hazard, or both. Only one of them can be N/A."); return; }
  const editId = $("editId").value;
  const existing = calls.find(c=>c.id===editId);
  const rec = {
    id: editId || ("c"+Date.now()+Math.random().toString(36).slice(2,6)),
    date:$("fDate").value, incident:$("fIncident").value.trim(), time:$("fTime").value,
    type:$("fType").value, hazard:$("fHazard").value, hrh:$("fHrh").value, intent:$("fIntent").value,
    canutec:$("fCanutec").value, oncar:$("fOncar").value, advice, specialist:$("fSpecialist").value,
    notes:$("fNotes").value.trim(), comments:$("fComments").value.trim(),
    followups: existing ? (existing.followups||[]) : [],
    logged: existing ? existing.logged : new Date().toISOString()
  };
  const dup = calls.find(c=>c.incident.toLowerCase()===rec.incident.toLowerCase() && c.id!==rec.id);
  if(dup && !confirm(`Incident ${rec.incident} is already logged (${dup.date} ${dup.time}). Save another entry anyway?`)) return;

  $("saveBtn").disabled = true; $("saveBtn").textContent = "Saving...";
  const { error } = await db.from("calls").upsert(rec);
  $("saveBtn").disabled = false; $("saveBtn").textContent = "Save Call";
  if(error){ alert("Save failed: " + error.message); return; }
  toast(editId ? "Call updated" : "Call saved to database");
  resetForm();
  await loadCalls(false);
});

function editCall(id){
  const c = calls.find(x=>x.id===id); if(!c) return;
  showTab("entry");
  $("editId").value=c.id; $("fDate").value=c.date; $("fIncident").value=c.incident; $("fTime").value=c.time;
  $("fType").value=c.type; $("fHazard").value=c.hazard; $("fHrh").value=c.hrh||"N/A"; $("fIntent").value=c.intent; $("fCanutec").value=c.canutec; $("fOncar").value=c.oncar||"";
  fillSpecialists(c.specialist);
  ADVICE.forEach((a,i)=>$("adv"+i).checked = c.advice.includes(a));
  $("fNotes").value=c.notes||""; $("fComments").value=c.comments||"";
  const fu=c.followups||[];
  $("followWrap").classList.toggle("hidden", !fu.length);
  $("followList").innerHTML = fu.map(f=>`<div class="fu"><span class="note">${esc(f.ts)} – ${esc(f.by)}</span><br>${esc(f.text)}</div>`).join("");
  $("formTitle").textContent="Edit Call – "+c.incident; $("saveBtn").textContent="Update Call";
  $("cancelEditBtn").classList.remove("hidden");
  window.scrollTo(0,0);
}
async function deleteCall(id){
  const c = calls.find(x=>x.id===id); if(!c) return;
  if(!confirm(`Delete incident ${c.incident} (${c.date})? This cannot be undone.`)) return;
  const { error } = await db.from("calls").delete().eq("id", id);
  if(error){ alert("Delete failed: " + error.message); return; }
  toast("Call deleted"); await loadCalls(false);
}
async function addFollowup(id){
  const c = calls.find(x=>x.id===id); if(!c) return;
  const text = prompt(`Add a follow-up comment to incident ${c.incident}:`); if(!text || !text.trim()) return;
  const by = prompt("Your name (specialist):", $("fSpecialist").value || DEFAULT_SPECS[0] || "") || "";
  const followups = [...(c.followups || [])];
  const d=new Date();
  followups.push({ts:`${todayStr()} ${pad(d.getHours())}:${pad(d.getMinutes())}`, by:by.trim(), text:text.trim()});
  const { error } = await db.from("calls").update({ followups }).eq("id", id);
  if(error){ alert("Comment failed: " + error.message); return; }
  toast("Comment added"); await loadCalls(false);
}
window._edit = editCall; window._del = deleteCall; window._fu = addFollowup;

function commentsHTML(c){
  let h = c.comments ? `<div>${esc(c.comments).replace(/\n/g,"<br>")}</div>` : "";
  (c.followups||[]).forEach(f=>{ h += `<div class="fu"><span class="note">${esc(f.ts)}${f.by?" – "+esc(f.by):""}</span><br>${esc(f.text)}</div>`; });
  return h || "—";
}
const sortCalls = arr => arr.slice().sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
function rowsHTML(list, actions){
  if(!list.length) return `<tr><td class="note">No calls found.</td></tr>`;
  return `<thead><tr><th>Date</th><th>Time</th><th>Incident #</th><th>Type</th><th>CBRNE Hazard</th><th>HRH</th><th>Intent</th><th>CANUTEC</th><th>On Car PS</th><th>Advice Given</th><th>Specialist</th><th>Product / UN</th><th style="min-width:220px">Comments</th>${actions?'<th></th>':''}</tr></thead><tbody>` +
    list.map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(c.time)}</td><td><b>${esc(c.incident)}</b></td><td>${esc(c.type)}</td><td>${esc(c.hazard)}</td><td>${esc(c.hrh||"—")}</td><td>${esc(c.intent)}</td><td>${esc(c.canutec)}</td><td>${esc(c.oncar||"—")}</td><td>${c.advice.map(a=>`<span class="pill">${esc(a)}</span>`).join(" ")||"—"}</td><td>${esc(c.specialist)}</td><td>${esc(c.notes)}</td><td>${commentsHTML(c)}</td>${actions?`<td style="white-space:nowrap"><button class="btn sm green" onclick="_fu('${c.id}')">+ Comment</button> <button class="btn sm grey" onclick="_edit('${c.id}')">Edit</button> <button class="btn sm red" onclick="_del('${c.id}')">Del</button></td>`:''}</tr>`).join("") + `</tbody>`;
}
function renderToday(){
  const t = sortCalls(calls.filter(c=>c.date===todayStr()));
  $("todayList").innerHTML = t.length ? `<div style="overflow:auto"><table>${rowsHTML(t,true)}</table></div>` : `<span class="note">No calls logged today.</span>`;
}

let logShowAll=false;
$("logMonth").value = thisMonth();
$("logMonth").oninput = ()=>{ logShowAll=false; renderLog(); };
$("logSearch").oninput = renderLog;
$("logAllBtn").onclick = ()=>{ logShowAll=true; renderLog(); };
function logFiltered(){
  const q = $("logSearch").value.toLowerCase().trim(), m=$("logMonth").value;
  return sortCalls(calls.filter(c=>(logShowAll||!m||c.date.startsWith(m)) && (!q || JSON.stringify(c).toLowerCase().includes(q))));
}
function renderLog(){ $("logTable").innerHTML = rowsHTML(logFiltered(), true); }

function toCSV(list){
  const h=["Date","Time of Call","Incident Number","Type","CBRNE Hazard","High Risk Hazard","Intent","CANUTEC Contacted","On Car Specialist Response","Advice Given","Specialist","Product / UN Number","Comments","Follow-up Comments"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  return [h.join(",")].concat(list.map(c=>[c.date,c.time,c.incident,c.type,c.hazard,c.hrh||"",c.intent,c.canutec,c.oncar||"",c.advice.join("; "),c.specialist,c.notes,c.comments,(c.followups||[]).map(f=>`[${f.ts}${f.by?" "+f.by:""}] ${f.text}`).join(" | ")].map(q).join(","))).join("\r\n");
}
function download(name, content, mime){
  const blob = new Blob([content],{type:mime}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
$("csvBtn").onclick = ()=> download(`CBRNE_HRH_Calls_${logShowAll?"All":$("logMonth").value}.csv`, "\uFEFF"+toCSV(logFiltered()), "text/csv");

// --- REPORT LOGIC ---
$("rptMonth").value = thisMonth();
$("rptMonth").oninput = renderReport;
$("rptMode").onchange = ()=>{
  $("rptMonthWrap").classList.toggle("hidden", $("rptMode").value !== "month");
  renderReport();
};
$("syncReportBtn").onclick = ()=> loadCalls(true);

function filteredReportCalls(){
  const mode = $("rptMode").value;
  if(mode === "ytd") return calls.filter(c=>c.date.startsWith(thisYear()));
  if(mode === "all") return calls.slice();
  const m = $("rptMonth").value;
  return calls.filter(c=>c.date.startsWith(m));
}
function reportPeriodLabel(){
  const mode = $("rptMode").value;
  if(mode === "ytd") return `Year-to-Date (${thisYear()})`;
  if(mode === "all") return `All-Time Summary`;
  return `Monthly Summary – ${monthName($("rptMonth").value)}`;
}
function tally(list, key, cats){
  const o={}; cats.forEach(c=>o[c]=0);
  list.forEach(c=>{ const vals = Array.isArray(c[key])?c[key]:[c[key]]; vals.forEach(v=>{ if(v) o[v]=(o[v]||0)+1; }); });
  return o;
}
function bars(title, obj, total){
  const sorted = Object.entries(obj).sort((a,b)=> b[1] - a[1]);
  return `<div class="stat"><h3>${title}</h3>` + sorted.map(([k,v])=>{
    const pct = total? Math.round(v/total*100):0;
    return `<div class="bar"><span class="lbl">${esc(k)}</span><span class="trk"><span class="fill" style="width:${pct}%;display:block"></span></span><span class="n">${v} (${pct}%)</span></div>`;
  }).join("") + `</div>`;
}
const noNA = o => { delete o["N/A"]; return o; };
function summaryData(){
  const list = filteredReportCalls(), n=list.length;
  const specs = [...new Set(DEFAULT_SPECS.concat(list.map(c=>c.specialist)))].filter(Boolean);
  return { list, n,
    type:tally(list,"type",TYPES), hazard:noNA(tally(list,"hazard",HAZARDS)),
    hrh:noNA(tally(list,"hrh",[])),
    nCbrne:list.filter(c=>c.hazard && c.hazard!=="N/A").length, nHrh:list.filter(c=>c.hrh && c.hrh!=="N/A").length, intent:tally(list,"intent",INTENTS),
    canutec:tally(list,"canutec",["Yes","No"]), oncar:tally(list,"oncar",["Yes","No"]), advice:tally(list,"advice",ADVICE),
    spec:Object.fromEntries(Object.entries(tally(list,"specialist",specs)).filter(([k,v])=>v>0)) };
}
function renderReport(){
  if($("rptMode").value === "month" && !$("rptMonth").value) return;
  const s=summaryData();
  $("reportArea").innerHTML = `
    <div class="rpt-head">
      <div><div style="font-size:20px;font-weight:700;color:var(--navy)">${esc(ORG_TITLE)}</div>
      <div style="font-size:16px">${reportPeriodLabel()}</div></div>
      <div class="note">Last synced ${new Date().toLocaleString("en-CA")}</div>
    </div>
    <div class="row" style="gap:40px;margin-bottom:16px">
      <div><div class="note">TOTAL CALLS</div><div class="big">${s.n}</div></div>
      <div><div class="note">CBRNE CALLS</div><div class="big">${s.nCbrne}</div></div>
      <div><div class="note">HIGH RISK HAZARD CALLS</div><div class="big">${s.nHrh}</div></div>
      <div><div class="note">CANUTEC CONTACTED</div><div class="big">${s.canutec.Yes}</div></div>
      <div><div class="note">ON CAR PS RESPONSE</div><div class="big">${s.oncar.Yes}</div></div>
      <div><div class="note">INTENTIONAL / SELF-HARM</div><div class="big">${s.intent.Intentional + s.intent["Self-harm"]}</div></div>
    </div>
    ${s.n ? `<div class="stats">
      ${bars("Type of Call", s.type, s.n)}
      ${bars("CBRNE Hazard", s.hazard, s.n)}
      ${Object.keys(s.hrh).length ? bars("High Risk Hazards (HRH)", s.hrh, s.n) : ""}
      ${bars("Intent", s.intent, s.n)}
      ${bars("CANUTEC Contacted", s.canutec, s.n)}
      ${bars("On Car Specialist Response", s.oncar, s.n)}
      ${bars("Advice Given*", s.advice, s.n)}
      ${bars("Calls by Specialist", s.spec, s.n)}
    </div>
    <p class="note">*More than one type of advice can be recorded per call, so percentages may add up to more than 100%. HRH list shows only hazards recorded during this period. A call can count as both CBRNE and HRH.</p>` : `<p class="note">No calls were recorded for this period.</p>`}`;
}

resetForm(); loadCalls(false);
})();
</script>
